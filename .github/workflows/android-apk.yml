name: Build MyMidiCC Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mymidicc-android-main
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Verify Roland JD-08 MIDI mapping and offline HTML
        run: python3 tests/test_jd08_reference.py

      - name: Refresh offline web update manifest
        run: |
          python3 tools/generate_web_manifest.py
          python3 tools/generate_web_manifest.py --check

      # Commit only the manifest generated from the public web directory.
      # The GITHUB_TOKEN push does not recursively start another workflow.
      - name: Publish web update manifest
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain -- web/manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/manifest.json
            git commit -m "chore: refresh MyMidiCC update manifest [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK. setup-android@v3 currently
      # attempts to install the removed legacy "tools" package and fails.
      - name: Install SDK 35 using the preinstalled command-line tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK (private install / test)
        uses: actions/upload-artifact@v4
        with:
          name: MyMidiCC-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
