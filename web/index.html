<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDI-CC Nachschlagewerk</title>
<style>
:root {
  color-scheme: dark;
  --bg: #121615; --panel: #1a211e; --line: #3a4740;
  --text: #f1f4ee; --muted: #bac7bd; --accent: #c9f58a;
  font-family: system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
main { width: min(1080px, 100% - 2rem); margin: 3rem auto; }
header { padding: 1.5rem 0; border-top: 4px solid var(--accent); }
h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); line-height: 1.06; letter-spacing: -.055em; }
h2 { margin: 0; font-size: clamp(1.25rem, 3vw, 1.6rem); }
.controls { display: grid; grid-template-columns: 1.3fr 1fr auto; gap: 1rem; align-items: end; }
label { display: grid; gap: .35rem; font-weight: 600; }
select, input { min-width: 0; width: 100%; font: inherit; padding: .65rem .7rem; border: 1px solid var(--line); border-radius: .45rem; background: var(--panel); color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
article { margin-top: 1.4rem; padding: 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: .6rem; }
article p, #status { color: var(--muted); margin: .45rem 0; }
details { margin-top: .6rem; }
summary { cursor: pointer; }
details ul { margin: .45rem 0 0; padding-left: 1.2rem; }
a { color: var(--accent); }
#status { margin: 1.2rem 0 .5rem; font-size: .9rem; }
.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: .55rem; }
table { width: 100%; border-collapse: collapse; text-align: left; }
th, td { padding: .65rem .8rem; border-bottom: 1px solid var(--line); }
thead { background: #263029; }
tbody tr:nth-child(even) { background: var(--panel); }
tbody tr:hover { background: #28352b; }
tbody tr:last-child td { border-bottom: 0; }
td:first-child { color: var(--accent); font: 600 .95rem ui-monospace, monospace; white-space: nowrap; }
td:nth-child(3), td:nth-child(4) { color: var(--muted); }
@media (max-width: 720px) {
  main { margin-top: 1.5rem; }
  .controls { grid-template-columns: 1fr; gap: .7rem; }
  th, td { padding: .55rem; }
}
</style>
</head>
<body>
<main>
  <header><h1>MIDI-CC Nachschlagewerk</h1></header>
  <div class="controls">
    <label>Gerät<select id="device"></select></label>
    <label>Suche<input id="search" type="search" placeholder="z. B. 74 oder Cutoff" autocomplete="off"></label>
    <label>MIDI-Typ<select id="kind">
      <option value="cc">CC und CC-Paare</option>
      <option value="all">Alle Einträge</option>
      <option value="NRPN">NRPN</option>
    </select></label>
  </div>
  <article>
    <h2 id="device-title"></h2>
    <p id="notes"></p>
    <details><summary>Herstellerquellen</summary><ul id="sources"></ul></details>
  </article>
  <p id="status" role="status"></p>
  <div class="table-wrap" role="region" aria-label="MIDI-Zuordnungen" tabindex="0">
    <table aria-label="MIDI-Zuordnungen für das ausgewählte Gerät">
      <thead><tr><th scope="col">Nr.</th><th scope="col">Parameter</th><th scope="col">Typ</th><th id="range" scope="col">CC-Werte</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <noscript>Bitte JavaScript im Browser aktivieren, um die Tabelle zu nutzen.</noscript>
</main>

const device = document.getElementById('device');
const search = document.getElementById('search');
const kind = document.getElementById('kind');
const body = document.getElementById('rows');
const range = document.getElementById('range');
const sources = document.getElementById('sources');
const status = document.getElementById('status');

devices.forEach(({ name }, index) => device.add(new Option(name, index)));

function renderDevice() {
  const selected = devices[Number(device.value)];
  document.getElementById('device-title').textContent = selected.name;
  document.getElementById('notes').textContent = selected.notes;
  sources.replaceChildren(...selected.sources.map(([label, url]) => {
    const item = document.createElement('li');
    const link = document.createElement('a');
    link.href = url;
    link.textContent = label;
    item.append(link);
    return item;
  }));
  kind.options[1].disabled = kind.options[2].disabled =
    !selected.rows.some(row => row[2] === 'NRPN');
  kind.value = 'cc';
  renderRows();
}

function renderRows() {
  const selected = devices[Number(device.value)];
  const query = search.value.trim().toLowerCase().replace(/^(?:cc|nrpn)\s*#?\s*(?=\d)/, '');
  const tokens = query.split(/\s+/).filter(Boolean);
  const showRange = selected.rows.some(row => row[3]);
  range.hidden = !showRange;

  const available = selected.rows.filter(([, , type]) =>
    kind.value === 'all' || (kind.value === 'cc' ? type !== 'NRPN' : type === 'NRPN')
  );
  const matching = available.filter(([number, name, type]) => {
    const searchable = (name + ' ' + type).toLowerCase();
    const numbers = number.split(':').map(Number);
    return tokens.every(token => {
      if (/^\d+$/.test(token)) return numbers.includes(Number(token)) || searchable.includes(token);
      if (/^\d+[:,.]\d+$/.test(token)) return number === token.replace(/[,.]/, ':');
      return searchable.includes(token);
    });
  });

  matching.sort((a, b) => a[0].localeCompare(b[0], 'de', { numeric: true }));
  const fragment = document.createDocumentFragment();
  for (const [number, name, type, values] of matching) {
    const row = document.createElement('tr');
    const cells = [number, name, type];
    if (showRange) cells.push(values || '—');
    for (const value of cells) {
      const cell = document.createElement('td');
      cell.textContent = value;
      row.append(cell);
    }
    fragment.append(row);
  }
  body.replaceChildren(fragment);
  status.textContent = matching.length
    ? `${matching.length} von ${available.length} Einträgen`
    : 'Keine Treffer.';
}

device.addEventListener('change', renderDevice);
kind.addEventListener('change', renderRows);
search.addEventListener('input', renderRows);
renderDevice();
</script>
